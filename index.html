<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>Myリペア | 暮らしの修理手帖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Myリペア ホーム">
        <span class="brand-mark">◎</span>
        <span><strong>Myリペア</strong><small>暮らしの修理手帖</small></span>
      </a>
      <div class="top-actions">
        <span class="privacy-note"><span class="privacy-dot"></span>この端末だけに保存</span>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークモードに切り替え" title="表示モードを切り替える">◐</button>
      </div>
    </header>

    <main>
      <section class="intro-section">
        <div class="intro-copy">
          <p class="eyebrow">REPAIR, REMEMBER, REUSE</p>
          <h1>直せることが、<br><em>暮らしの自信</em>になる。</h1>
          <p class="intro-text">身近な故障への対処方法と、頼れる人を記録しておくための修理リストです。</p>
        </div>
        <div class="progress-panel" aria-label="修理スキルの進捗">
          <div class="progress-top"><span>修理の手帖</span><strong id="progress-label">0 / 34</strong></div>
          <div class="progress-track"><span id="progress-bar"></span><span id="self-progress-bar"></span></div>
          <p><span id="progress-percent">0%</span> の項目に対応先を登録済み</p>
          <p class="self-progress"><span id="self-percent">0%</span> は自分で修理できる</p>
        </div>
      </section>

      <section class="toolbar" aria-label="修理項目の操作">
        <div class="filter-tabs" role="tablist" aria-label="カテゴリで絞り込む">
          <button class="filter-tab active" data-filter="all" role="tab">すべて <span>34</span></button>
        </div>
      </section>

      <section class="legend-row">
        <!-- <p><span class="legend-icon done">✓</span> 登録済み <span class="legend-icon empty">○</span> 未登録</p> -->
        <p class="legend-tone"><span class="legend-deep"></span>濃い色 = 自分でできる</p>
        <p class="sync-status" id="sync-status">変更は自動保存されます</p>
      </section>
      <div class="repair-header" aria-hidden="true"><span>修理項目（ヒント）</span><span>修理記録</span><span>修理・頼めますか？</span></div>
      <section class="repair-grid" id="repair-grid" aria-live="polite"></section>
      <p class="empty-state" id="empty-state" hidden>条件に合う修理項目がありません。</p>
    </main>

    <footer class="footer"><span>MY REPAIR / PERSONAL KNOWLEDGE BASE</span><a href="https://hinodeyasuzuki.github.io/myecoliferecords/" target="_blank" rel="noreferrer">Myエコライフ記録 ↗</a></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
